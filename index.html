<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CartCompare — Citrus County</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f0; color: #1a1a1a; min-height: 100vh; }

    /* NAV */
    .topnav { background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 0 16px; display: flex; align-items: center; gap: 10px; height: 58px; position: sticky; top: 0; z-index: 100; }
    .topnav-logo { height: 42px; width: auto; }
    .topnav-brand { font-size: 20px; font-weight: 900; color: #1a4d1f; }
    .topnav-brand span { color: #43b02a; }
    .nav-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .cart-btn { background: #43b02a; color: #fff; border: none; padding: 8px 16px; border-radius: 22px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .cart-badge { background: #fff; color: #43b02a; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
    .brand-toggle { display: flex; background: #f0f0f0; border-radius: 20px; padding: 3px; }
    .brand-btn { padding: 5px 12px; border-radius: 17px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; background: transparent; color: #888; transition: all 0.2s; }
    .brand-btn.active { background: #43b02a; color: #fff; }

    /* ===================== STORE SELECTION PAGE ===================== */
    #storePage { display: block; }
    #mainPage  { display: none; }

    .sp-wrap { max-width: 520px; margin: 0 auto; padding: 0 0 40px; }

    /* Hero search */
    .sp-hero { background: #fff; padding: 18px 16px 14px; border-bottom: 1px solid #eee; }
    .sp-location { font-size: 13px; font-weight: 700; color: #1a1a1a; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .sp-location-pin { font-size: 16px; }
    .sp-search-wrap { position: relative; }
    .sp-search { width: 100%; padding: 12px 16px 12px 42px; border: 1.5px solid #e0e0e0; border-radius: 28px; font-size: 15px; outline: none; background: #f7f7f7; color: #1a1a1a; }
    .sp-search:focus { border-color: #43b02a; background: #fff; }
    .sp-search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; color: #888; pointer-events: none; }

    /* Town filter pills */
    .sp-towns { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; background: #fff; border-bottom: 1px solid #eee; scrollbar-width: none; }
    .sp-towns::-webkit-scrollbar { display: none; }
    .sp-town-pill { padding: 6px 14px; border-radius: 20px; border: 1.5px solid #e0e0e0; background: #fff; font-size: 12px; font-weight: 700; cursor: pointer; color: #555; white-space: nowrap; flex-shrink: 0; transition: all 0.18s; }
    .sp-town-pill.active { background: #1a4d1f; color: #fff; border-color: #1a4d1f; }

    /* Section header */
    .sp-section { padding: 18px 16px 8px; font-size: 13px; font-weight: 800; color: #1a1a1a; letter-spacing: 0.1px; }

    /* Store grid */
    .sp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; padding: 0 10px 6px; }
    @media (max-width: 360px) { .sp-grid { grid-template-columns: repeat(3, 1fr); } }

    .sp-store-tile {
      display: flex; flex-direction: column; align-items: center;
      padding: 10px 6px 12px; cursor: pointer; border-radius: 12px;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .sp-store-tile:active { background: #f0f4f0; }
    .sp-store-tile.selected .sp-logo-box { border-color: #43b02a; box-shadow: 0 0 0 2px #43b02a; }
    .sp-store-tile.selected .sp-store-name { color: #1a4d1f; }

    .sp-logo-box {
      width: 68px; height: 68px; border-radius: 16px; background: #fff;
      border: 1.5px solid #e8e8e8; display: flex; align-items: center; justify-content: center;
      overflow: hidden; margin-bottom: 7px; transition: border-color 0.15s, box-shadow 0.15s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.07);
    }
    .sp-logo-box .chain-initial {
      font-size: 26px; font-weight: 900; letter-spacing: -1px;
    }
    .sp-store-name { font-size: 11px; font-weight: 700; text-align: center; color: #1a1a1a; line-height: 1.3; }
    .sp-store-town { font-size: 10px; color: #888; font-weight: 500; text-align: center; margin-top: 1px; }

    /* Chain brand colors for initials */
    .chain-walmart  { color: #0071CE; }
    .chain-publix   { color: #007749; }
    .chain-aldi     { color: #00529B; }
    .chain-target   { color: #CC0000; }

    /* Chain logo backgrounds */
    .bg-walmart  { background: #e8f4ff; }
    .bg-publix   { background: #e6f4ee; }
    .bg-aldi     { background: #e6eef9; }
    .bg-target   { background: #fde8e8; }

    /* CTA button */
    .sp-cta-wrap { padding: 16px 16px 0; }
    .sp-cta-btn {
      width: 100%; padding: 15px; border-radius: 28px; border: none;
      background: #43b02a; color: #fff; font-size: 16px; font-weight: 800;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 14px rgba(67,176,42,0.35);
      transition: background 0.15s;
    }
    .sp-cta-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }
    .sp-cta-btn:not(:disabled):active { background: #37941f; }
    .sp-sel-count { font-size: 13px; font-weight: 600; opacity: 0.85; }

    /* Select all row */
    .sp-select-all-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 2px; }
    .sp-select-all-btn { font-size: 12px; font-weight: 700; color: #43b02a; background: none; border: none; cursor: pointer; padding: 4px 0; }

    /* Loading spinner */
    .sp-loading { text-align: center; padding: 40px 20px; color: #888; font-size: 14px; }
    .spinner { width: 36px; height: 36px; border: 4px solid #e0e0e0; border-top-color: #43b02a; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===================== MAIN APP PAGE ===================== */
    .main-wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .layout { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

    /* Back button */
    .back-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .back-btn { background: #fff; border: 1.5px solid #e0e0e0; border-radius: 22px; padding: 7px 16px; font-size: 13px; font-weight: 700; cursor: pointer; color: #555; display: flex; align-items: center; gap: 6px; }
    .back-btn:hover { border-color: #43b02a; color: #1a4d1f; }
    .back-store-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .back-store-chip { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 12px; color: #fff; }

    /* FILTER BAR */
    .filter-bar { background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .filter-label { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-right: 4px; }
    .search-input { flex: 1; min-width: 180px; padding: 8px 12px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 14px; outline: none; }
    .search-input:focus { border-color: #43b02a; }
    .cat-select { padding: 8px 12px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 13px; background: #fff; outline: none; cursor: pointer; }

    /* PRODUCT CARDS */
    .product-grid { display: flex; flex-direction: column; gap: 12px; }
    .product-card { background: #fff; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
    .pc-header { display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px; border-bottom: 1px solid #f0f0f0; }
    .pc-cat { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #888; }
    .pc-name { font-size: 15px; font-weight: 800; color: #1a1a1a; }
    .pc-meta { font-size: 12px; color: #888; }
    .pc-add-btn { margin-left: auto; background: #43b02a; color: #fff; border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 300; line-height: 1; }
    .pc-add-btn:hover { background: #37941f; }
    .pc-prices { padding: 10px 16px 14px; }
    .price-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f8f8f8; }
    .price-row:last-child { border-bottom: none; }
    .pr-rank { width: 20px; font-size: 11px; font-weight: 700; color: #bbb; flex-shrink: 0; }
    .pr-rank.best { color: #43b02a; }
    .pr-store { font-size: 13px; font-weight: 600; flex: 1; }
    .pr-location { font-size: 11px; color: #888; }
    .pr-price { font-size: 15px; font-weight: 800; color: #1a1a1a; }
    .pr-price.best { color: #43b02a; }
    .sale-badge { background: #ef4444; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px; margin-left: 6px; }
    .price-row.on-sale { background: #fff8f0; border-radius: 8px; margin: 1px -4px; padding-left: 4px; padding-right: 4px; }
    .pr-price-orig { font-size: 11px; color: #bbb; text-decoration: line-through; margin-right: 4px; }
    .savings-row { display: flex; align-items: center; justify-content: flex-end; padding: 8px 0 0; }
    .savings-chip { background: #f0fdf4; color: #16a34a; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 20px; }

    /* CART PANEL */
    .cart-panel { background: #fff; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); position: sticky; top: 74px; }
    .cp-header { background: linear-gradient(135deg, #1a4d1f 0%, #2d7a35 100%); border-radius: 14px 14px 0 0; padding: 16px 18px; color: #fff; }
    .cp-title { font-size: 16px; font-weight: 900; margin-bottom: 4px; }
    .cp-sub { font-size: 12px; opacity: 0.8; }
    .cp-body { padding: 14px 16px; }
    .cp-empty { text-align: center; padding: 30px 0; color: #bbb; font-size: 13px; }
    .cp-empty-icon { font-size: 36px; margin-bottom: 8px; }

    /* CART ITEMS */
    .cart-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .cart-item:last-child { border-bottom: none; }
    .ci-name { font-size: 13px; font-weight: 600; flex: 1; line-height: 1.3; }
    .ci-meta { font-size: 11px; color: #888; display: block; }
    .qty-ctrl { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .qty-btn { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid #e0e0e0; background: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #43b02a; line-height: 1; }
    .qty-btn:hover { background: #f0fdf4; border-color: #43b02a; }
    .qty-num { font-size: 14px; font-weight: 700; min-width: 18px; text-align: center; }
    .btn-remove { background: none; border: none; color: #ddd; font-size: 16px; cursor: pointer; padding: 2px; }
    .btn-remove:hover { color: #ef4444; }

    /* STORE TOTALS */
    .totals-section { margin-top: 14px; border-top: 2px solid #f0f0f0; padding-top: 14px; }
    .totals-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #888; margin-bottom: 10px; }
    .store-total-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 10px; margin-bottom: 6px; border: 1.5px solid #e8e8e8; }
    .store-total-row.winner { border-color: #43b02a; background: #f0fdf4; }
    .st-name { font-size: 13px; font-weight: 700; }
    .st-price { font-size: 16px; font-weight: 900; }
    .store-total-row.winner .st-price { color: #43b02a; }
    .winner-badge { font-size: 10px; font-weight: 700; background: #43b02a; color: #fff; padding: 2px 8px; border-radius: 10px; }
    .savings-summary { background: linear-gradient(135deg, #f0fdf4, #dcfce7); border-radius: 10px; padding: 12px 14px; margin-top: 10px; text-align: center; }
    .ss-label { font-size: 11px; font-weight: 700; color: #16a34a; text-transform: uppercase; letter-spacing: 0.5px; }
    .ss-amount { font-size: 26px; font-weight: 900; color: #16a34a; }
    .ss-sub { font-size: 11px; color: #888; }
    .clear-btn { width: 100%; margin-top: 12px; background: transparent; color: #ef4444; border: 1.5px solid #fca5a5; padding: 9px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .clear-btn:hover { background: #fef2f2; }

    /* PAGINATION */
    .pagination { display: flex; gap: 6px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
    .page-btn { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid #e0e0e0; background: #fff; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; }
    .page-btn.active { background: #43b02a; color: #fff; border-color: #43b02a; }
    .page-btn:hover:not(.active) { border-color: #43b02a; color: #43b02a; }
    .page-nav { padding: 0 12px; border-radius: 17px; width: auto; }

    /* STATS BAR */
    .stats-bar { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .stat-chip { background: #fff; border-radius: 10px; padding: 10px 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); flex: 1; min-width: 100px; text-align: center; }
    .stat-num { font-size: 22px; font-weight: 900; color: #1a4d1f; }
    .stat-label { font-size: 11px; color: #888; font-weight: 600; }

    /* LOADING */
    .loading { text-align: center; padding: 60px 20px; color: #888; }
  </style>
</head>
<body>

<!-- TOP NAV -->
<nav class="topnav">
  <img class="topnav-logo" src="https://club1054.github.io/cartcompare/logo.png" onerror="this.style.display='none'" alt="CartCompare"/>
  <div class="topnav-brand"><span>Cart</span>Compare</div>
  <div class="nav-right" id="navRight">
    <!-- populated after store selection -->
  </div>
</nav>

<!-- ==================== STORE SELECTION PAGE ==================== -->
<div id="storePage">
  <div class="sp-wrap">

    <!-- Search bar -->
    <div class="sp-hero">
      <div class="sp-location"><span class="sp-location-pin">📍</span> Citrus County, Florida</div>
      <div class="sp-search-wrap">
        <span class="sp-search-icon">🔍</span>
        <input class="sp-search" id="spSearch" type="text" placeholder="Search stores..." oninput="filterStoreTiles()"/>
      </div>
    </div>

    <!-- Town filter -->
    <div class="sp-towns" id="spTowns">
      <button class="sp-town-pill active" onclick="setSpTown('all',this)">All Towns</button>
      <button class="sp-town-pill" onclick="setSpTown('Crystal River',this)">Crystal River</button>
      <button class="sp-town-pill" onclick="setSpTown('Hernando',this)">Hernando</button>
      <button class="sp-town-pill" onclick="setSpTown('Homosassa',this)">Homosassa</button>
      <button class="sp-town-pill" onclick="setSpTown('Inverness',this)">Inverness</button>
      <button class="sp-town-pill" onclick="setSpTown('Lecanto',this)">Lecanto</button>
    </div>

    <!-- Store grid -->
    <div class="sp-section">Choose your stores</div>
    <div class="sp-select-all-row">
      <span style="font-size:12px;color:#888" id="spSelLabel">Tap stores to select</span>
      <button class="sp-select-all-btn" id="spSelAllBtn" onclick="toggleSelectAll()">Select All</button>
    </div>

    <div id="spLoading" class="sp-loading"><div class="spinner"></div>Loading stores…</div>
    <div id="spGrid" class="sp-grid" style="display:none"></div>

    <!-- CTA -->
    <div class="sp-cta-wrap">
      <button class="sp-cta-btn" id="spCtaBtn" onclick="goToMain()" disabled>
        🛒 Compare Prices <span class="sp-sel-count" id="spSelCount"></span>
      </button>
    </div>

  </div>
</div>

<!-- ==================== MAIN APP PAGE ==================== -->
<div id="mainPage">
  <div class="main-wrap">

    <!-- Back bar -->
    <div class="back-bar">
      <button class="back-btn" onclick="goBack()">← Change Stores</button>
      <div class="back-store-chips" id="backStoreChips"></div>
    </div>

    <!-- STATS BAR -->
    <div class="stats-bar">
      <div class="stat-chip"><div class="stat-num" id="statProducts">—</div><div class="stat-label">Products</div></div>
      <div class="stat-chip"><div class="stat-num" id="statStores">—</div><div class="stat-label">Stores</div></div>
      <div class="stat-chip"><div class="stat-num" id="statSavings">—</div><div class="stat-label">Max Savings</div></div>
      <div class="stat-chip"><div class="stat-num" id="statCart">$0.00</div><div class="stat-label">Cart (Best)</div></div>
    </div>

    <!-- FILTER BAR -->
    <div class="filter-bar">
      <div class="filter-row">
        <input class="search-input" type="text" placeholder="🔍 Search products..." id="searchBox" oninput="onSearch()"/>
        <select class="cat-select" id="catSelect" onchange="onSearch()">
          <option value="">All Categories</option>
          <option>Beverages</option>
          <option>Bread & Bakery</option>
          <option>Breakfast & Cereal</option>
          <option>Dairy</option>
          <option>Deli & Prepared</option>
          <option>Frozen Foods</option>
          <option>Meat & Seafood</option>
          <option>Pantry & Dry Goods</option>
          <option>Personal Care</option>
          <option>Produce</option>
          <option>Snacks</option>
          <option>Household</option>
        </select>
        <div class="brand-toggle">
          <button class="brand-btn active" id="btnName" onclick="setBrand('name')">Name Brand</button>
          <button class="brand-btn" id="btnStore" onclick="setBrand('store')">Store Brand</button>
        </div>
      </div>
    </div>

    <div class="layout">
      <!-- PRODUCT LIST -->
      <div>
        <div id="productGrid" class="product-grid">
          <div class="loading"><div class="spinner"></div>Loading products & prices…</div>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>

      <!-- CART PANEL -->
      <div class="cart-panel" id="cartPanel">
        <div class="cp-header">
          <div class="cp-title">🛒 My Cart</div>
          <div class="cp-sub" id="cpSub">Add items to compare store totals</div>
        </div>
        <div class="cp-body" id="cartBody">
          <div class="cp-empty">
            <div class="cp-empty-icon">🛒</div>
            <div>Your cart is empty</div>
            <div style="margin-top:6px;font-size:12px;color:#bbb">Tap + on any product to add it</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://kdnkupipubiwchoiuedw.supabase.co/rest/v1';
const SUPABASE_KEY = 'sb_publishable_w7MlMQ6_6JJNJp_2MGE0mw_bE9TtXkX';
const HEADERS = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };

const STORE_OVERRIDES = {
  1: { name: 'Aldi Crystal River', location: 'Crystal River, FL', chain: 'Aldi' },
  2: { name: 'Publix Crystal River', location: 'Crystal River, FL', chain: 'Publix' },
  3: { name: 'Target Crystal River', location: 'Crystal River, FL', chain: 'Target' },
  4: { name: 'Walmart Crystal River', location: 'Crystal River, FL', chain: 'Walmart' },
};

const CHAIN_COLORS = {
  'Walmart': '#0071CE', 'Publix': '#007749', 'Aldi': '#00529B', 'Target': '#CC0000'
};

const CHAIN_BG = {
  'Walmart': '#e8f4ff', 'Publix': '#e6f4ee', 'Aldi': '#e6eef9', 'Target': '#fde8e8'
};

const CHAIN_INITIALS = {
  'Walmart': 'W', 'Publix': 'P', 'Aldi': 'A', 'Target': 'T'
};

let allStores = [], allProducts = [], allPrices = [];
let filteredProducts = [];
let selectedStoreIds = new Set();
let currentBrand = 'name';
let currentPage = 1;
const PAGE_SIZE = 15;
let cart = {};
let spCurrentTown = 'all';

async function api(path) {
  const r = await fetch(SUPABASE_URL + path, { headers: HEADERS });
  return r.json();
}

function getStore(s) {
  const ov = STORE_OVERRIDES[s.id];
  if (ov) return { ...s, ...ov };
  const n = s.name || '';
  let chain = 'Other';
  if (n.toLowerCase().includes('walmart')) chain = 'Walmart';
  else if (n.toLowerCase().includes('publix')) chain = 'Publix';
  else if (n.toLowerCase().includes('aldi')) chain = 'Aldi';
  else if (n.toLowerCase().includes('target')) chain = 'Target';
  return { ...s, chain };
}

function getStoreTown(s) {
  const loc = (s.location || '').toLowerCase();
  if (loc.includes('crystal river')) return 'Crystal River';
  if (loc.includes('hernando')) return 'Hernando';
  if (loc.includes('homosassa')) return 'Homosassa';
  if (loc.includes('inverness')) return 'Inverness';
  if (loc.includes('lecanto')) return 'Lecanto';
  return 'Other';
}

// ===================== STORE SELECTION PAGE =====================

function setSpTown(town, el) {
  spCurrentTown = town;
  document.querySelectorAll('.sp-town-pill').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderStoreTiles();
}

function filterStoreTiles() { renderStoreTiles(); }

function renderStoreTiles() {
  const q = (document.getElementById('spSearch').value || '').toLowerCase();
  const grid = document.getElementById('spGrid');

  const visible = allStores.filter(s => {
    const townMatch = spCurrentTown === 'all' || getStoreTown(s) === spCurrentTown;
    const qMatch = !q || s.name.toLowerCase().includes(q) || (s.location||'').toLowerCase().includes(q);
    return townMatch && qMatch;
  });

  grid.innerHTML = visible.map(s => {
    const color = CHAIN_COLORS[s.chain] || '#888';
    const bg = CHAIN_BG[s.chain] || '#f5f5f5';
    const initial = CHAIN_INITIALS[s.chain] || s.name[0];
    const town = getStoreTown(s);
    const sel = selectedStoreIds.has(s.id);
    return `
      <div class="sp-store-tile ${sel ? 'selected' : ''}" onclick="toggleStore(${s.id})" id="tile-${s.id}">
        <div class="sp-logo-box" style="background:${bg}">
          <span class="chain-initial" style="color:${color}">${initial}</span>
        </div>
        <div class="sp-store-name">${s.name.replace(' Crystal River','').replace(' Homosassa','').replace(' Inverness','').replace(' Hernando','').replace(' Lecanto','')}</div>
        <div class="sp-store-town">${town}</div>
      </div>`;
  }).join('');

  updateSpCta();
}

function toggleStore(id) {
  if (selectedStoreIds.has(id)) {
    selectedStoreIds.delete(id);
  } else {
    selectedStoreIds.add(id);
  }
  const tile = document.getElementById('tile-' + id);
  if (tile) tile.classList.toggle('selected', selectedStoreIds.has(id));
  updateSpCta();
}

function toggleSelectAll() {
  const q = (document.getElementById('spSearch').value || '').toLowerCase();
  const visible = allStores.filter(s => {
    const townMatch = spCurrentTown === 'all' || getStoreTown(s) === spCurrentTown;
    const qMatch = !q || s.name.toLowerCase().includes(q) || (s.location||'').toLowerCase().includes(q);
    return townMatch && qMatch;
  });
  const allSel = visible.every(s => selectedStoreIds.has(s.id));
  if (allSel) {
    visible.forEach(s => selectedStoreIds.delete(s.id));
  } else {
    visible.forEach(s => selectedStoreIds.add(s.id));
  }
  renderStoreTiles();
}

function updateSpCta() {
  const n = selectedStoreIds.size;
  const btn = document.getElementById('spCtaBtn');
  const countEl = document.getElementById('spSelCount');
  const label = document.getElementById('spSelLabel');
  const selAllBtn = document.getElementById('spSelAllBtn');

  btn.disabled = n === 0;
  countEl.textContent = n > 0 ? `(${n} store${n > 1 ? 's' : ''})` : '';
  label.textContent = n > 0 ? `${n} store${n > 1 ? 's' : ''} selected` : 'Tap stores to select';

  // Update select all button text
  const q = (document.getElementById('spSearch').value || '').toLowerCase();
  const visible = allStores.filter(s => {
    const townMatch = spCurrentTown === 'all' || getStoreTown(s) === spCurrentTown;
    const qMatch = !q || s.name.toLowerCase().includes(q) || (s.location||'').toLowerCase().includes(q);
    return townMatch && qMatch;
  });
  const allSel = visible.length > 0 && visible.every(s => selectedStoreIds.has(s.id));
  selAllBtn.textContent = allSel ? 'Deselect All' : 'Select All';
}

function goToMain() {
  if (selectedStoreIds.size === 0) return;
  document.getElementById('storePage').style.display = 'none';
  document.getElementById('mainPage').style.display = 'block';

  // Update nav right
  document.getElementById('navRight').innerHTML = `
    <button class="cart-btn" onclick="scrollToCart()">
      🛒 Cart <span class="cart-badge" id="cartCount">0</span>
    </button>`;

  // Show selected store chips in back bar
  const chips = document.getElementById('backStoreChips');
  const sel = allStores.filter(s => selectedStoreIds.has(s.id));
  chips.innerHTML = sel.map(s => {
    const color = CHAIN_COLORS[s.chain] || '#888';
    return `<span class="back-store-chip" style="background:${color}">${s.name.split(' ')[0]}</span>`;
  }).join('');

  // Update stats
  document.getElementById('statStores').textContent = selectedStoreIds.size;
  updateStats();
  renderProducts();
}

function goBack() {
  document.getElementById('mainPage').style.display = 'none';
  document.getElementById('storePage').style.display = 'block';
  document.getElementById('navRight').innerHTML = '';
}

// ===================== MAIN APP LOGIC =====================

function getActiveStores() {
  return allStores.filter(s => selectedStoreIds.has(s.id));
}

async function loadData() {
  const [stores, products, prices] = await Promise.all([
    api('/v3_stores?select=*&order=id.asc'),
    api('/v3_products?select=*&order=category.asc,name.asc&limit=200'),
    api('/v3_prices?select=*&limit=2000')
  ]);
  allStores = stores.map(getStore);
  allProducts = products;
  allPrices = prices;
  filteredProducts = [...allProducts];

  // Show store grid
  document.getElementById('spLoading').style.display = 'none';
  document.getElementById('spGrid').style.display = 'grid';
  renderStoreTiles();
}

function updateStats() {
  document.getElementById('statProducts').textContent = allProducts.length;
  let totalSavings = 0;
  allProducts.forEach(p => {
    const pricesForP = allPrices.filter(pr => pr.product_id === p.id && selectedStoreIds.has(pr.store_id));
    const vals = pricesForP.map(pr => currentBrand === 'name' ? pr.name_brand_price : pr.store_brand_price).filter(v => v > 0);
    if (vals.length >= 2) totalSavings += Math.max(...vals) - Math.min(...vals);
  });
  document.getElementById('statSavings').textContent = '$' + totalSavings.toFixed(0);
}

function onSearch() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const cat = document.getElementById('catSelect').value;
  filteredProducts = allProducts.filter(p => {
    const matchQ = !q || p.name.toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q);
    const matchCat = !cat || p.category === cat;
    return matchQ && matchCat;
  });
  currentPage = 1;
  renderProducts();
}

function setBrand(brand) {
  currentBrand = brand;
  document.getElementById('btnName').classList.toggle('active', brand === 'name');
  document.getElementById('btnStore').classList.toggle('active', brand === 'store');
  updateStats();
  renderProducts();
  renderCart();
}

function getPriceForStore(productId, storeId) {
  const p = allPrices.find(pr => pr.product_id === productId && pr.store_id === storeId);
  if (!p) return null;
  const price = currentBrand === 'name' ? p.name_brand_price : p.store_brand_price;
  if (!price || price <= 0) return null;
  return { price, onSale: p.on_sale, salePrice: p.sale_price };
}

function renderProducts() {
  const activeStores = getActiveStores();
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageProducts = filteredProducts.slice(start, start + PAGE_SIZE);
  const grid = document.getElementById('productGrid');

  if (pageProducts.length === 0) {
    grid.innerHTML = '<div class="loading">No products found</div>';
    renderPagination();
    return;
  }

  grid.innerHTML = pageProducts.map(p => {
    const storePrices = activeStores.map(s => {
      const pd = getPriceForStore(p.id, s.id);
      if (!pd) return null;
      return { store: s, ...pd };
    }).filter(Boolean).sort((a, b) => a.price - b.price);

    if (storePrices.length === 0) return '';

    const worst = storePrices[storePrices.length - 1];
    const savings = (worst.price - storePrices[0].price).toFixed(2);
    const qty = cart[p.id] || 0;

    const priceRows = storePrices.map((sp, i) => {
      const isBest = i === 0;
      const displayPrice = sp.onSale && sp.salePrice ? sp.salePrice : sp.price;
      const chainColor = CHAIN_COLORS[sp.store.chain] || '#888';
      return `
        <div class="price-row${sp.onSale ? ' on-sale' : ''}">
          <div class="pr-rank ${isBest ? 'best' : ''}">${isBest ? '★' : (i+1)}</div>
          <div style="flex:1">
            <div class="pr-store" style="color:${chainColor}">${sp.store.name}</div>
            <div class="pr-location">${sp.store.location}</div>
          </div>
          <div style="display:flex;align-items:center;gap:4px">
            ${sp.onSale && sp.salePrice ? `<span class="pr-price-orig">$${sp.price.toFixed(2)}</span>` : ''}
            <span class="pr-price ${isBest ? 'best' : ''}">$${displayPrice.toFixed(2)}</span>
            ${sp.onSale ? '<span class="sale-badge">SALE</span>' : ''}
          </div>
        </div>`;
    }).join('');

    return `
      <div class="product-card" id="pc-${p.id}">
        <div class="pc-header">
          <div>
            <div class="pc-cat">${p.category || ''}</div>
            <div class="pc-name">${p.name}</div>
            <div class="pc-meta">${p.size || ''} ${p.name_brand ? '• ' + p.name_brand : ''}</div>
          </div>
          ${qty > 0
            ? `<div class="qty-ctrl" style="margin-left:auto">
                <button class="qty-btn" onclick="changeQty(${p.id},-1)">−</button>
                <span class="qty-num">${qty}</span>
                <button class="qty-btn" onclick="changeQty(${p.id},1)">+</button>
               </div>`
            : `<button class="pc-add-btn" onclick="changeQty(${p.id},1)" title="Add to cart">+</button>`
          }
        </div>
        <div class="pc-prices">
          ${priceRows}
          ${parseFloat(savings) > 0 ? `
            <div class="savings-row">
              <div class="savings-chip">💰 Best vs. Most Expensive — Save $${savings}</div>
            </div>` : ''}
        </div>
      </div>`;
  }).join('');

  renderPagination();
}

function renderPagination() {
  const total = Math.ceil(filteredProducts.length / PAGE_SIZE);
  const pg = document.getElementById('pagination');
  if (total <= 1) { pg.innerHTML = ''; return; }
  let html = `<button class="page-btn page-nav" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>← Prev</button>`;
  for (let i = 1; i <= total; i++) {
    if (i === 1 || i === total || Math.abs(i - currentPage) <= 2) {
      html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    } else if (Math.abs(i - currentPage) === 3) {
      html += `<span style="padding:0 4px;color:#bbb">…</span>`;
    }
  }
  html += `<button class="page-btn page-nav" onclick="goPage(${currentPage+1})" ${currentPage===total?'disabled':''}>Next →</button>`;
  pg.innerHTML = html;
}

function goPage(p) {
  const total = Math.ceil(filteredProducts.length / PAGE_SIZE);
  if (p < 1 || p > total) return;
  currentPage = p;
  renderProducts();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function changeQty(productId, delta) {
  cart[productId] = Math.max(0, (cart[productId] || 0) + delta);
  if (cart[productId] === 0) delete cart[productId];
  updateCartCount();
  renderCart();
  const p = allProducts.find(x => x.id === productId);
  if (p) {
    const qty = cart[productId] || 0;
    const el = document.getElementById(`pc-${productId}`);
    if (el) {
      const header = el.querySelector('.pc-header');
      const existing = header.querySelector('.qty-ctrl, .pc-add-btn');
      if (existing) existing.remove();
      const ctrl = document.createElement('div');
      if (qty > 0) {
        ctrl.className = 'qty-ctrl';
        ctrl.style.marginLeft = 'auto';
        ctrl.innerHTML = `<button class="qty-btn" onclick="changeQty(${p.id},-1)">−</button><span class="qty-num">${qty}</span><button class="qty-btn" onclick="changeQty(${p.id},1)">+</button>`;
      } else {
        ctrl.className = 'pc-add-btn';
        ctrl.title = 'Add to cart';
        ctrl.textContent = '+';
        ctrl.onclick = () => changeQty(p.id, 1);
      }
      header.appendChild(ctrl);
    }
  }
}

function updateCartCount() {
  const total = Object.values(cart).reduce((a, b) => a + b, 0);
  const el = document.getElementById('cartCount');
  if (el) el.textContent = total;
}

function renderCart() {
  const cartIds = Object.keys(cart).map(Number);
  const body = document.getElementById('cartBody');

  if (cartIds.length === 0) {
    body.innerHTML = '<div class="cp-empty"><div class="cp-empty-icon">🛒</div><div>Your cart is empty</div><div style="margin-top:6px;font-size:12px;color:#bbb">Tap + on any product to add it</div></div>';
    document.getElementById('cpSub').textContent = 'Add items to compare store totals';
    document.getElementById('statCart').textContent = '$0.00';
    return;
  }

  let itemsHtml = cartIds.map(id => {
    const p = allProducts.find(x => x.id === id);
    if (!p) return '';
    const qty = cart[id];
    return `
      <div class="cart-item">
        <div class="ci-name">
          ${p.name}
          <span class="ci-meta">${p.size || ''} × ${qty}</span>
        </div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty(${id},-1)">−</button>
          <span class="qty-num">${qty}</span>
          <button class="qty-btn" onclick="changeQty(${id},1)">+</button>
        </div>
        <button class="btn-remove" onclick="removeItem(${id})">✕</button>
      </div>`;
  }).join('');

  const activeStores = getActiveStores();
  const storeTotals = activeStores.map(s => {
    let total = 0;
    let hasAll = true;
    cartIds.forEach(id => {
      const pd = getPriceForStore(id, s.id);
      if (!pd) { hasAll = false; return; }
      const price = pd.onSale && pd.salePrice ? pd.salePrice : pd.price;
      total += price * cart[id];
    });
    return { store: s, total: hasAll ? total : null };
  }).filter(s => s.total !== null).sort((a, b) => a.total - b.total);

  let totalsHtml = '';
  if (storeTotals.length > 0) {
    const winner = storeTotals[0];
    const worst = storeTotals[storeTotals.length - 1];
    const savings = (worst.total - winner.total).toFixed(2);

    document.getElementById('statCart').textContent = '$' + winner.total.toFixed(2);
    document.getElementById('cpSub').textContent = `${cartIds.length} item${cartIds.length>1?'s':''} • Best: $${winner.total.toFixed(2)}`;

    totalsHtml = `
      <div class="totals-section">
        <div class="totals-label">Store Totals</div>
        ${storeTotals.map((st, i) => `
          <div class="store-total-row ${i===0?'winner':''}">
            <div>
              <div class="st-name">${st.store.name}</div>
              <div style="font-size:11px;color:#888">${st.store.location}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              ${i===0 ? '<span class="winner-badge">BEST</span>' : ''}
              <div class="st-price">$${st.total.toFixed(2)}</div>
            </div>
          </div>`).join('')}
        ${parseFloat(savings) > 0 ? `
          <div class="savings-summary">
            <div class="ss-label">You Could Save</div>
            <div class="ss-amount">$${savings}</div>
            <div class="ss-sub">vs. most expensive store</div>
          </div>` : ''}
        <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
      </div>`;
  }

  body.innerHTML = itemsHtml + totalsHtml;
}

function removeItem(id) {
  delete cart[id];
  updateCartCount();
  renderCart();
  renderProducts();
}

function clearCart() {
  cart = {};
  updateCartCount();
  renderCart();
  renderProducts();
}

function scrollToCart() {
  document.getElementById('cartPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

loadData();
</script>
</body>
</html>
